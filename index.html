<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="A CV editor that runs entirely in your browser: guided writing, live preview, 15 templates, PDF and image export. No account, no upload." />
    <link rel="canonical" href="https://keireki-craft.eu/" />
    <!-- The card a shared link shows (spec 066); absolute URLs, as the crawlers need. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keireki Craft" />
    <meta property="og:url" content="https://keireki-craft.eu/" />
    <meta property="og:title" content="Keireki Craft · a CV editor that runs in your browser" />
    <meta property="og:description" content="Guided writing, live preview, 15 templates, PDF and image export. No account, no upload: your CV never leaves your device." />
    <meta property="og:image" content="https://keireki-craft.eu/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Keireki Craft logo next to a sample CV" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Until the app applies the chosen theme, the system's; then the page colour of the theme (spec 029). -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f1f4f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Keireki Craft</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
